<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meraki · Resultados del Comité</title>
<style>
  :root{
    --navy:#0D216C;--navy-deep:#071B62;--blue:#0675CE;--teal:#0EC6D0;
    --ink:#1f2632;--ink-soft:#5b6470;--line:#e4e7ec;--line-soft:#eef1f5;
    --bg:#f4f6f9;--paper:#ffffff;--band:#f2f7fc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;}
  .page{max-width:960px;margin:26px auto;background:var(--paper);box-shadow:0 2px 30px rgba(13,33,108,0.08);}
  .runhead{display:flex;justify-content:space-between;align-items:center;padding:24px 44px;border-bottom:1px solid var(--line-soft);}
  .runhead .neo img{height:30px;display:block;}
  .runhead .meta{text-align:right;}
  .runhead .meta .t1{color:var(--navy);font-weight:700;font-size:12px;letter-spacing:.08em;}
  .runhead .meta .t2{color:var(--ink-soft);font-size:11.5px;}
  .head{padding:34px 44px 0;}
  .head h1{margin:0;font-size:26px;font-weight:700;color:var(--navy);}
  .head .accent{height:3px;width:60px;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:2px;margin:12px 0 0;}
  .head .sub{margin-top:12px;font-size:14px;color:var(--ink-soft);}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 44px 6px;}
  .count{font-size:13px;color:var(--ink-soft);}
  .count b{color:var(--navy);}
  .spacer{flex:1;}
  .search{flex:0 0 240px;max-width:100%;}
  .search input{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-family:inherit;font-size:13.5px;color:var(--ink);}
  .search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(6,117,206,0.10);}
  .btn{border:1px solid var(--line);background:#fff;color:var(--navy);font-family:inherit;font-weight:600;
    font-size:12.5px;padding:9px 15px;border-radius:6px;cursor:pointer;}
  .btn:hover{border-color:var(--blue);}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.primary:hover{background:var(--blue);border-color:var(--blue);}
  .list{padding:16px 44px 40px;}
  .state{padding:40px 4px;color:var(--ink-soft);font-size:14px;text-align:center;}
  .state.err{color:#c0392b;}
  .card{border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px;background:#fff;}
  .card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line-soft);}
  .card .name{color:var(--navy);font-weight:700;font-size:16px;}
  .card .time{font-size:11.5px;color:#9aa4b2;}
  .qa{margin-bottom:14px;}
  .qa:last-child{margin-bottom:0;}
  .qa .qlabel{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--blue);
    text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:5px;}
  .qa .qnum{display:inline-flex;width:18px;height:18px;border-radius:4px;background:var(--band);color:var(--navy);
    align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .qa p{margin:0;font-size:14px;color:var(--ink);white-space:pre-wrap;line-height:1.55;}
  .qa .empty{color:#aeb6c2;font-style:italic;}
  .footer{padding:16px 44px 24px;}
  .footer p{margin:0;font-size:11px;color:#9aa4b2;border-top:1px solid var(--line-soft);padding-top:14px;}
  .footer a{color:var(--blue);text-decoration:none;}
  @media (max-width:680px){.runhead,.head,.toolbar,.list,.footer{padding-left:22px;padding-right:22px;}.search{flex-basis:100%;}}
</style>
</head>

    <div class="meta"><div class="t1">COMITÉ DE LIDERAZGO</div><div class="t2">Panel de resultados</div></div>
  </div>

  <div class="head">
    <h1>Resultados del comité</h1>
    <div class="accent"></div>
    <div class="sub">Respuestas recibidas a las tres preguntas del marco de reflexión estratégica.</div>
  </div>

  <div class="toolbar">
    <div class="count" id="count">Cargando…</div>
    <div class="spacer"></div>
    <div class="search"><input type="text" id="search" placeholder="Buscar por nombre o texto…"></div>
    <button class="btn" id="refreshBtn">Actualizar</button>
    <button class="btn primary" id="csvBtn">Exportar CSV</button>
  </div>

  <div class="list" id="list"><div class="state">Cargando respuestas…</div></div>

  <div class="footer"><p><a href="/">← Volver al formulario</a> · <span id="whoami"></span></p></div>
</div>

<script>
let ALL = [];

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(iso){try{if(!iso)return '';return new Date(iso).toLocaleString('es-ES',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}

(async()=>{try{const r=await fetch('/.auth/me');if(r.ok){const d=await r.json();const u=d&&d.clientPrincipal;
  if(u&&u.userDetails)document.getElementById('whoami').innerHTML='Sesión: '+esc(u.userDetails)+' · <a href="/.auth/logout">Cerrar sesión</a>';}
}catch(e){}})();

function render(items){
  const list=document.getElementById('list');
  if(!items.length){list.innerHTML='<div class="state">No hay respuestas que mostrar.</div>';return;}
  list.innerHTML=items.map(e=>`<div class="card">
    <div class="meta"><span class="name">${esc(e.nombre||'Sin nombre')}</span><span class="time">${fmt(e.timestamp)}</span></div>
    <div class="qa"><div class="qlabel"><span class="qnum">1</span> Preservar y consolidar</div>
      ${e.q1?`<p>${esc(e.q1)}</p>`:'<p class="empty">Sin respuesta</p>'}</div>
    <div class="qa"><div class="qlabel"><span class="qnum">2</span> Foco y renuncia</div>
      ${e.q2?`<p>${esc(e.q2)}</p>`:'<p class="empty">Sin respuesta</p>'}</div>
    <div class="qa"><div class="qlabel"><span class="qnum">3</span> Neovantas future-back</div>
      ${e.q3?`<p>${esc(e.q3)}</p>`:'<p class="empty">Sin respuesta</p>'}</div>
  </div>`).join('');
}

function applyFilter(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const f=!q?ALL:ALL.filter(e=>[e.nombre,e.q1,e.q2,e.q3].join(' ').toLowerCase().includes(q));
  document.getElementById('count').innerHTML='<b>'+f.length+'</b> '+(f.length===1?'respuesta':'respuestas')+(q?' (filtradas)':'');
  render(f);
}

async function load(){
  const list=document.getElementById('list');
  list.innerHTML='<div class="state">Cargando respuestas…</div>';
  document.getElementById('count').textContent='Cargando…';
  try{
    const r=await fetch('/api/responses');
    if(r.status===401){location.href='/.auth/login/aad';return;}
    if(r.status===403){list.innerHTML='<div class="state err">No tienes permiso para ver los resultados. Solicita el rol de revisor.</div>';document.getElementById('count').textContent='';return;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    ALL=(d&&d.items)||[];
    applyFilter();
  }catch(err){
    list.innerHTML='<div class="state err">No se pudieron cargar las respuestas. Inténtalo de nuevo.</div>';
    document.getElementById('count').textContent='';
  }
}

function toCSV(rows){
  const head=['Nombre','Pregunta 1','Pregunta 2','Pregunta 3','Enviado el'];
  const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')];
  rows.forEach(e=>lines.push([e.nombre,e.q1,e.q2,e.q3,e.timestamp].map(q).join(',')));
  return '\ufeff'+lines.join('\r\n');
}

document.getElementById('refreshBtn').addEventListener('click',load);
document.getElementById('search').addEventListener('input',applyFilter);
document.getElementById('csvBtn').addEventListener('click',()=>{
  const q=document.getElementById('search').value.trim().toLowerCase();
  const rows=!q?ALL:ALL.filter(e=>[e.nombre,e.q1,e.q2,e.q3].join(' ').toLowerCase().includes(q));
  const blob=new Blob([toCSV(rows)],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='respuestas-meraki.csv';document.body.appendChild(a);a.click();a.remove();
});

load();
</script>
</body>
